name: Deploy

on:
  push:
    branches: [develop]

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-homepage
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/arm64
          build-args: |
            INTERNAL_API_ORIGIN=${{ secrets.INTERNAL_API_ORIGIN }}
            PUBLIC_ORIGIN=https://bcsdlab.com
          tags: |
            ghcr.io/bcsdlab/bcsd-homepage:latest
            ghcr.io/bcsdlab/bcsd-homepage:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ghcr.io/bcsdlab/bcsd-homepage:latest
            docker stop bcsd-homepage || true
            docker rm bcsd-homepage || true
            mkdir -p /data/bcsd-homepage/game-builds
            docker run -d \
              --name bcsd-homepage \
              --restart unless-stopped \
              -p 127.0.0.1:3003:3000 \
              -v /data/bcsd-homepage/game-builds:/app/game-builds \
              -e INTERNAL_API_ORIGIN='${{ secrets.INTERNAL_API_ORIGIN }}' \
              -e GAME_BUILD_SECRET='${{ secrets.GAME_BUILD_SECRET }}' \
              -e GAME_BUILD_STORAGE_DIR='/app/game-builds' \
              -e ADMIN_ORIGIN='${{ secrets.ADMIN_ORIGIN }}' \
              -e PUBLIC_ORIGIN='https://bcsdlab.com' \
              ghcr.io/bcsdlab/bcsd-homepage:latest
